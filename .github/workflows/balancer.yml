name: Bash Profile Balancer

"on":
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

jobs:
  balance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git Identity
        run: |
          # We use the secondary account's identity for commits/PRs
          git config --global user.name "PicasoTheDeal101"
          git config --global user.email "PicasoTheDeal101@users.noreply.github.com"

      - name: Run Bash Balancer Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECONDARY_PAT: ${{ secrets.SECONDARY_PAT }}
        run: bash balance.sh
