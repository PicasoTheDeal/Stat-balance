name: Bash Profile Balancer

"on":
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

jobs:
  balance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git Identity
        run: |
          git config --global user.name "PicasoTheDeal"
          git config --global user.email "PicasoTheDeal@users.noreply.github.com"

      - name: Run Bash Balancer Script
        env:
          GH_TOKEN: ${{ secrets.MAIN_PAT }}
        run: bash balance.sh
